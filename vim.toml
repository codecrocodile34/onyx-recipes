name = "vim"
version = "9.1.0000"
description = "Vi IMproved, a highly configurable text editor"
source = { type = "tarball", url = "https://github.com/vim/vim/archive/refs/tags/v9.1.0000.tar.gz", sha256 = "8d2a74e358be9cf260174e15e2e29dba4773f2670718b5bf728db6f54b90e25d" }
build = "autotools"
depends = ["ncurses (>= 6.4)"]

# The image has no X and no gettext, so the terminal build is the only one
# that will configure. tlib is what vim calls its terminal library
configure_args = [
    "--with-tlib=ncurses",
    "--disable-gui",
    "--without-x",
    "--disable-nls",
]
