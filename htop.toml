name = "htop"
version = "3.3.0"
description = "Interactive process viewer for the terminal"
source = { type = "tarball", url = "https://github.com/htop-dev/htop/releases/download/3.3.0/htop-3.3.0.tar.xz", sha256 = "a69acf9b42ff592c4861010fce7d8006805f0d6ef0e8ee647a6ee6e59b743d5c" }
build = "autotools"
depends = ["ncurses (>= 6.4)"]

# The ncurses recipe builds without wide character support, so htop has to be
# told not to look for ncursesw
configure_args = ["--disable-unicode"]
